repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: prompt-lock
        name: prompt versions locked
        entry: backend/.venv/bin/python -c "import sys; sys.path.insert(0, 'backend'); from keeper.llm.prompts import check_lock; p = check_lock(); print(*p, sep='\n'); sys.exit(1 if p else 0)"
        language: system
        files: ^config/prompts/
        pass_filenames: false
