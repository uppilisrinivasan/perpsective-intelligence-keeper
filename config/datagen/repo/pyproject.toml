[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamina"
version = "0.1.0"
description = "Layered configuration files with includes and environment interpolation"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.*"]

[project.scripts]
lamina = "lamina.cli:main"

[tool.setuptools.packages.find]
include = ["lamina*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
