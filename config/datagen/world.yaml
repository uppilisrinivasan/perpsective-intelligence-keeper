# The demo world's values (the role of datagen_world in docs/03-data/06): names, voices, wording.
# Authored for this build instead of generated by a model; see docs/build-log.md. Structure, timing, IDs, diffs
# and test results are produced by code, git and pytest from these values and scenario.yaml.
version: 1
project:
  owner: fernhill-oss
  owner_display: Fernhill OSS
  repo: lamina
  package: lamina
  description: "Layered configuration files for Python, with includes and environment interpolation. No runtime dependencies."
  license: Apache-2.0
  topics: [configuration, config-files, python]
  default_branch: main

# Scenario areas → where their code lives in the repository.
areas:
  lexer:       {path: lamina/lexer,       title: tokenizer}
  parser:      {path: lamina/parser,      title: parser}
  model:       {path: lamina/model,       title: document model}
  dump:        {path: lamina/dump,        title: writer}
  include:     {path: lamina/include,     title: includes}
  interpolate: {path: lamina/interpolate, title: interpolation}
  loader:      {path: lamina/loader,      title: loader}
  errors:      {path: lamina/diagnostics, title: errors}
  cli:         {path: lamina/cli,         title: command line}
  build:       {path: scripts,            title: build and release}
  docs:        {path: docs,               title: docs}

feature_nouns:
  include: [optional, glob, search_path, fallback, env_named, layered, scoped, prefixed, ordered, quoted, pinned, mirrored, chained, local, shared, nested]
  interpolate: [strict, lenient, quoted, typed_int, typed_bool, path, url, listy, prefixed, upper, trimmed, nested_default, masked, escaped]
  lexer: [comma, pipe, colon, bracket, quote, escape, dotted, unicode, number, duration, size, flag, semicolon, hexnum]
  parser: [list, inline_table, boolean, integer, decimal, duration, size, date, choice, pair, setlike, interval]
  model: [layers, defaults, overrides, profiles, local, user, system, fallback, patch, staging]
  dump: [compact, aligned, minimal, annotated, env_file, diffable, canonical, indented, plain, wrapped]
  loader: [layered, profile, directory, env_file, defaults, merged, glob, home, xdg, project, override, chain]
  errors: [duplicate_key, missing_section, bad_escape, include_cycle, depth_exceeded, encoding, type_mismatch, empty_value]
  cli: [keys, sections, lint, fmt, diff, env, merge, explain, validate, export]

