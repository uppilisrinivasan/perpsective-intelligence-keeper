# Voice cards drive the wording below and the style hints Keeper later rediscovers.
voices:
  maintainer: {greeting_rate: 0.25, question_rate: 0.3, suggestion_block_rate: 0.15, body_sections: [summary, blocking, nits]}
  security_reviewer: {greeting_rate: 0.05, question_rate: 0.2, suggestion_block_rate: 0.0, body_sections: [checklist]}
  occasional: {greeting_rate: 0.5, question_rate: 0.2, suggestion_block_rate: 0.1, body_sections: [summary]}

# Review comment wording per concern slot. Placeholders: {fn} {file} {path} {param} {new_param} {dep} {exc}
# {err_class} {var} {camel} {snake} {arg} {cache_pr} {revert_pr} {race_issue}
phrases:
  maintainer:
    E1:
      - "This include path can escape the project root: `{fn}` joins the name to the base directory but never checks the result stays inside the root. Please realpath it and compare against the real root."
      - "Include paths have to stay inside the project root. `{fn}` needs the same containment check as `resolve_include`: realpath, then commonpath against the root. Symlinks count."
      - "Can this include path escape the project root? I think `@include \"../../x\"` works here. Include paths stay inside the root, always (realpath + commonpath)."
      - "This include path can still escape the project root through a symlink: abspath isn't enough. Resolve with realpath before the root check."
    E2:
      - "This breaks the round trip: `dumps(loads(x))` has to give back `x` exactly, and sorting here changes the key order the user wrote. Please keep the original order."
      - "Round trip: writing has to preserve the original key order, comments and blank lines. This reorders entries on the way out."
      - "Please don't sort: it breaks the round trip. `dumps(loads(x)) == x` is the one promise lamina makes, key order included."
    E3:
      - "No new runtime dependencies, ever: lamina has zero. If `{dep}` is useful it can be an optional extra, imported lazily."
      - "This adds a runtime dependency (`{dep}`). lamina has zero runtime dependencies on purpose; please make it an optional extra."
      - "No new runtime dependency, please. An optional extra for `{dep}` is fine; a hard dependency isn't."
    E4:
      - "This calls `re` for every character in the tokenizer loop. The tokenizer is the hot path: `ch.isspace()` does the same without a regex per character."
      - "Please no regex per character in the tokenizer loop; it's the hot path and this turns milliseconds into seconds on big files."
      - "Regex per character in the tokenizer loop: the tokenizer runs on every load. Use `str` methods here."
    E5:
      - "We had this load cache before: #{cache_pr} added it and #{revert_pr} reverted it because it raced (#{race_issue}). No cache in the loader without a lock and mtime invalidation."
      - "Careful: a load cache in the loader is exactly how we got #{race_issue}. We reverted the last one in #{revert_pr}; see #{cache_pr}."
      - "This is the same load cache as #{cache_pr}, which we reverted in #{revert_pr} after the race in #{race_issue}. What makes it safe this time?"
    E6:
      - "User-facing errors must be a LaminaError subclass with a line and a column. A bare `{exc}` loses the position, and the CLI can't report it."
      - "Please raise `{err_class}` (a LaminaError subclass) here, with the line and column; callers catch LaminaError."
      - "`{exc}` escapes the LaminaError hierarchy: every error a user can hit needs a LaminaError with the line and column where it happened."
    E7:
      - "Renaming `{param}` breaks every caller that passes it as a keyword. Deprecate first: keep `{param}` working for one minor release with a DeprecationWarning, then remove it."
      - "`{fn}` is public API, so deprecate before removing: accept `{param}` too, emit a DeprecationWarning, and note it in the changelog."
      - "Removing `{param}` without a deprecation period breaks people on upgrade. Deprecate first: keep both names for a release, with a DeprecationWarning."
    E8:
      - "This puts the environment value in the error message. Environment values are secrets in practice (tokens, passwords): errors and logs may only name the variable."
      - "Please don't put the environment value of `{var}` in the error message; it ends up in CI logs. The variable name is enough."
      - "Error messages must never contain environment values, only the variable name. This one prints the value."
    S1:
      - "Could you add a test for `{fn}`?"
      - "Please add tests for the new behaviour, at least the happy path and one error case."
      - "Needs a test before it can go in."
    S2:
      - "nit: `{camel}` → `{snake}`, we use snake_case."
      - "nit: naming, please use snake_case (`{snake}`)."
    S3:
      - "Please add a docstring to `{fn}`, it's public."
      - "`{fn}` is public, so it needs a docstring."
      - "Could you add a short docstring for `{fn}`?"
    S4:
      - "Mutable default argument: `{arg}=[]` is shared between calls. Use `None` and create the list inside."
      - "`{arg}=[]` as a default will leak values between calls. Please default to None."
      - "Bare `except:` also catches KeyboardInterrupt and hides real bugs. Catch the specific error."
    B1:
      - "Please pass `encoding=\"utf-8\"` to open(); the default depends on the platform."
    B2:
      - "This leaks the file handle if the check raises before close(); please use `with`."
    X1:
      - "Every branch of `{fn}` needs its own test case, including the error branch."
      - "Please give every branch of `{fn}` its own test case before merging."
      - "One test case per branch of `{fn}`, please: every branch, including the error one."
    D1:
      - "Please add type hints to `{fn}`: public functions get type hints now."
      - "Type hints on `{fn}`, please: public functions get type hints on parameters and the return type."
      - "Public functions get type hints now. Could you add type hints to `{fn}`?"
    social_approve: ["LGTM, thanks!", "Looks good, thank you.", "Thanks, merging.", "Nice work, thanks!", "Thanks for the quick update. LGTM."]
    social_comment: ["Thanks for this!", "Thanks for picking this up.", "Thanks!"]
    question: ["What's the use case for this?", "Is this ready for review, or still in progress?", "Do you have an example config that needs this?"]
    review_body_changes: ["A few things before this can go in.", "Thanks! Some changes needed, see inline.", "Close, but a couple of things first."]
    review_body_comment: ["Some notes inline.", "A couple of small things.", "Mostly fine, see the notes."]
    rejection_slop: ["Thanks, but I'm closing this: the description doesn't say what problem it solves and the tests fail. Happy to look at a focused PR that explains the change and includes a test.", "Closing this one, sorry: I can't tell what it's for, and it references functions that don't exist in lamina. A smaller PR with a clear description would be very welcome."]
    rejection_dep: ["Closing: lamina doesn't take runtime dependencies. If you'd like to add this as an optional extra, I'd be glad to review that."]
  security_reviewer:
    T1:
      - "Build and release scripts have to be reproducible: this fetches something at build time. Please vendor it or pin it by hash, outside the build."
      - "`scripts/` shouldn't reach the network. What happens to our releases if that URL changes under us?"
    T2:
      - "A binary fixture without a generator script and a checksum: please commit what produces it and its sha256, so we can regenerate and verify it."
      - "I can't review a binary blob. Can you add the source and the checksum to scripts/build_fixtures.py?"
    T3:
      - "Recursion without a depth limit: a crafted include chain can exhaust the stack. Please bound it like MAX_DEPTH in include/core.py."
      - "This walks includes recursively with no limit; a malicious config could take the loader down. Needs a depth cap."
    T4:
      - "Path confinement: please verify the resolved path is under the root (realpath, then commonpath)."
      - "Does this keep the path inside the project root? Symlinks and `..` both need handling."
    E1:
      - "Path confinement again: the resolved include must stay under the root, including through symlinks."
    social_approve: ["Approved from a security point of view.", "Fine by me security-wise."]
    review_body_changes: ["Security review: changes needed before merge.", "A few security notes."]
  occasional:
    S1: ["Could you add a test?", "A test for this would be good."]
    S2: ["nit: naming (`{camel}` → `{snake}`)."]
    S3: ["Docstring would be nice here."]
    S4: ["Mutable default argument here (`{arg}=[]`).", "Bare except might hide errors."]
    social_approve: ["LGTM", "Looks good to me!", "Approved, thanks."]
  author_replies:
    ack: ["Done, thanks!", "Good catch, fixed.", "Updated.", "Fixed in the latest push.", "Makes sense, changed."]
    ack_history: ["Ah, I didn't know about #{cache_pr}. Removed the cache.", "Thanks for the history, I've dropped the cache."]
    disagree: ["I think this is fine as is because it's only used internally?", "Is that really needed here?"]
  learner_notes:
    catch_style: ["{fn}: {statement}", "I think {statement_lc}", "{statement}", "Not sure, but {statement_lc}"]
    noise: ["Maybe rename `{fn}` to something shorter?", "Could this use a list comprehension?", "Formatting looks a bit off here.", "Is this function needed?"]

pr_text:
  feature_titles: ["Add {noun_h} {area_title}", "Support {noun_h} {area_title}", "{area_title_cap}: {noun_h} support", "Add {fn}"]
  bugfix_titles: ["Fix {noun_h} handling in {area_title}", "Fix {fn} edge case", "Handle {noun_h} values correctly"]
  refactor_titles: ["Refactor {fn}", "Simplify {noun_h} {area_title}", "Clean up {area_title} helpers"]
  tests_titles: ["Add tests for {fn}", "More tests for {noun_h} {area_title}"]
  docs_titles: ["Docs: explain {topic}", "Docs: {topic} examples", "Fix typos in {topic} docs"]
  build_titles: ["CI: {ci_change}", "Release script: {rel_change}"]
  deps_titles: ["Use {dep} for {purpose}", "Add {dep} support"]
  feature_body: ["This adds `{fn}` for {noun_h} {area_title}.\n\n{test_line}", "Adds {noun_h} support to the {area_title} via `{fn}`.\n\n{test_line}", "I needed {noun_h} {area_title} for a project, so here's `{fn}`.\n\n{test_line}"]
  bugfix_body: ["`{fn}` mishandled {noun_h} values. This fixes it.\n\n{test_line}", "Fixes #{issue}.\n\n{test_line}"]
  refactor_body: ["No behaviour change; `{fn}` is easier to follow now.", "Small cleanup of `{fn}`."]
  tests_body: ["Adds tests for `{fn}`."]
  docs_body: ["Clarifies the {topic} docs.", "Adds examples for {topic}."]
  build_body: ["{change_line}"]
  deps_body: ["`{dep}` makes {purpose} much easier. This adds it as a dependency and uses it in `{fn}`."]
  slop_body: ["This PR improves the overall code quality and adds new functionality to enhance the user experience. The changes follow best practices and make the codebase more robust and maintainable.", "## Summary\nThis pull request introduces several improvements.\n\n## Changes\n- Improved functionality\n- Better error handling\n- Code cleanup\n\n## Testing\nAll tests pass.", "Enhanced the module with additional features for better performance and reliability. This is a significant improvement that will benefit all users."]
  slop_titles: ["Improve {area_title} functionality", "Enhance {area_title} module", "Refactor and improve code quality", "Add new features to {area_title}"]
  test_line_with: "Tests in `{test_file}`."
  test_line_without: "Tested locally."
  docs_topics: [includes, interpolation, the format, the CLI, round-trip writing, errors]
  ci_changes: ["test on Python 3.13", "cache pip downloads", "run the linter", "split lint and tests"]
  rel_changes: ["print checksums", "check the version tag", "clean build directories first"]
  revert_body: "Reverts {owner}/{repo}#{n}"
  commit_messages:
    initial: ["Add {fn}", "{area_title_cap}: add {noun_h} support", "Initial {noun_h} implementation"]
    fixup: ["Address review comments", "Fix review feedback", "Apply suggestions from review", "Update after review"]
    tests: ["Add tests", "Add tests for {fn}"]

issues:
  E1: {title: "Include outside the project directory is read", body: "With a config that does `@include \"../outside.conf\"`, `{fn}` (added in #{pr}) reads the file even though it's outside the project root.\n\nExpected an IncludeError."}
  E2: {title: "dumps() reorders keys in my config", body: "After upgrading, writing a config back with `{fn}` changes the order of the keys in each section. It started after #{pr}."}
  E5: {title: "Stale values after editing a config in a long-running process", body: "Our service reloads its config on SIGHUP. Since #{pr} the old values come back. Looks like the loader caches the parsed file and never invalidates it, and two threads can see different values."}
  E6: {title: "Errors from {fn} have no line number", body: "When `{fn}` fails I get a bare exception with no line or column, unlike other lamina errors. Introduced in #{pr}."}
  E7: {title: "TypeError after upgrading: unexpected keyword argument '{param}'", body: "`{fn}({param}=...)` worked in the previous release and now raises TypeError. Changed in #{pr} without a deprecation."}
  E8: {title: "Secret printed in CI log when a variable is invalid", body: "An InterpolationError printed the full value of one of our environment variables (an API token) into the CI log. From `{fn}`, added in #{pr}."}
  E4: {title: "Tokenizing large files got slow", body: "Loading a 20k-line config takes several seconds since #{pr}. Profiling points at `{fn}`."}
  S4: {title: "Values leak between calls to {fn}", body: "Calling `{fn}` twice returns entries from the first call. Probably the mutable default argument from #{pr}."}
  B1: {title: "UnicodeDecodeError on Windows when a config has non-ASCII text", body: "On Windows with a non-UTF-8 locale, `{fn}` fails with UnicodeDecodeError for a file containing `Zoë`. Added in #{pr}."}
  B2: {title: "ResourceWarning: unclosed file when an include is empty", body: "Running with -W error, `{fn}` leaks a file handle when it raises for an empty file (from #{pr})."}
  base: {title: "Wrong result from {fn} in an edge case", body: "`{fn}` returns an unexpected value for an empty section. Seen since #{pr}."}
  feature_requests: ["Support YAML sources?", "Allow comments at the end of section headers", "Expose line numbers on entries", "Add a `--json` flag to the CLI", "Document how to use lamina with Django", "Support multiline values", "Question: how do includes interact with interpolation?", "Allow `.d` directories of config fragments"]

